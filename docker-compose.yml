services:
  web1:
    image: nginx:alpine
    container_name: web1
    volumes:
      - ./server1:/usr/share/nginx/html:ro
    networks:
      - lbnet

  web2:
    image: nginx:alpine
    container_name: web2
    volumes:
      - ./server2:/usr/share/nginx/html:ro
    networks:
      - lbnet

  lb:
    image: nginx:alpine
    container_name: loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - lbnet

networks:
  lbnet:
    driver: bridge
